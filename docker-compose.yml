services:
  backend:
    build:
      context: ./backend
    container_name: botshield-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # In Docker, allow the frontend container / browser via published ports
      CORS_ORIGINS: "http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173,http://127.0.0.1:5173"
      DATABASE_URL: "sqlite:////data/botshield.db"
      SIMULATION_ALLOWED_HOST: "127.0.0.1,localhost,backend"
    volumes:
      - botshield-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api/v1
    container_name: botshield-frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

  # Optional Redis for multi-worker rate limiting demos
  # Uncomment and set RATE_LIMIT_STORAGE=redis REDIS_URL=redis://redis:6379/0
  # redis:
  #   image: redis:7-alpine
  #   ports:
  #     - "6379:6379"

volumes:
  botshield-data:
